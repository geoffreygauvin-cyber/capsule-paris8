<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="CAPSULE : consultations psychologiques gratuites pour les étudiant·es de Paris 8, par des étudiant·es de M2 de psychologie.">
<title>CAPSULE Paris 8</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap">
<style>
/* Concept : une page à plat, sans ombres ni effets, en écho à la charte de l'Université Paris 8. Framboise, violet, coquelicot et bordeaux sur crème, Poppins, un ruban qui change de couleur par tronçons (le contour de la capsule) et la construction « logo, barre fine, nom de l'entité ». Une seule identité, sans mode sombre. */
:root {
  --cream: #FDF5EB; --white: #FFFFFF; --ink: #1F1217; --muted: #5E4B55; --line: #E8D9D3;
  --raspberry: #AE164E; --purple: #7B206B; --poppy: #E30F1B; --maroon: #75151F;
  --rose: #F9DEE5; --lilac: #EADCF0; --blush: #FFDAD6;
  --f: "Poppins", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { background: var(--cream); color: var(--ink); font-family: var(--f); font-size: 17px; line-height: 1.7; padding-inline: 20px; padding-block: 0; }
h1, h2, h3, p, ul, ol { margin: 0; padding: 0; }
h1, h2, h3 { font-weight: 600; line-height: 1.08; letter-spacing: -.025em; text-wrap: balance; }
h1 span, h2 span { color: var(--raspberry); }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--purple); outline-offset: 3px; border-radius: 8px; }
.wrap { max-width: 1120px; margin-inline: auto; }
.rule { display: flex; width: 96px; height: 6px; border-radius: 3px; overflow: hidden; margin-bottom: 22px; }
.rule i { display: block; height: 100%; }
.rule i:nth-child(1) { background: var(--purple); width: 40%; }
.rule i:nth-child(2) { background: var(--raspberry); width: 40%; }
.rule i:nth-child(3) { background: var(--poppy); width: 20%; }

/* en-tête */
.top { display: flex; align-items: center; justify-content: space-between; gap: 16px 28px; flex-wrap: wrap; padding-block: 24px; }
.brand { display: flex; align-items: center; gap: 14px; text-decoration: none; }
.wm { font-weight: 700; font-size: 20px; letter-spacing: .06em; line-height: 1; }
.wm small { display: block; font-weight: 500; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; margin-top: 7px; color: var(--muted); }
nav { display: flex; gap: 26px; font-weight: 500; font-size: 15px; flex-wrap: wrap; align-items: center; }
nav a { text-decoration: none; color: var(--muted); }
nav a:hover { color: var(--raspberry); }
.btn { display: inline-block; font-weight: 600; font-size: 15px; text-decoration: none; padding: 14px 30px; border-radius: 999px; background: var(--raspberry); color: var(--white); border: 2px solid var(--raspberry); transition: background .15s ease, border-color .15s ease; }
.btn:hover { background: var(--purple); border-color: var(--purple); }
.btn.line { background: transparent; color: var(--raspberry); }
.btn.line:hover { background: var(--raspberry); color: var(--white); border-color: var(--raspberry); }
nav .btn { padding: 9px 22px; font-size: 14px; color: var(--white); }
nav .btn:hover { color: var(--white); }

/* hero */
.hero { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, .8fr); gap: 56px; align-items: center; padding-block: 40px 88px; }
.kicker { font-size: 13px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: var(--raspberry); margin-bottom: 22px; }
.hero h1 { font-size: clamp(2.9rem, 7vw, 5.4rem); font-weight: 700; }
.lead { font-size: 1.15rem; max-width: 48ch; margin-top: 28px; color: var(--muted); }
.lead b { color: var(--ink); font-weight: 600; }
.actions { display: flex; flex-wrap: wrap; gap: 14px 26px; margin-top: 36px; align-items: center; }
.textlink { font-weight: 600; color: var(--raspberry); text-decoration: underline; text-underline-offset: 5px; text-decoration-thickness: 2px; }
.capsule { position: relative; overflow: hidden; isolation: isolate; width: 100%; max-width: 360px; aspect-ratio: 5 / 7; justify-self: center; border-radius: 999px; background: var(--rose); display: grid; place-items: center; }
.capsule .lw { position: relative; z-index: 1; height: 56%; display: grid; place-items: center; }
/* superpositions d'encres : deux aplats qui se multiplient, derrière le logo */
.ov { position: absolute; border-radius: 50%; mix-blend-mode: multiply; }

section { padding-block: 76px; }
.head { max-width: 660px; margin-bottom: 46px; }
.head h2 { font-size: clamp(2.2rem, 4.6vw, 3.4rem); }
.head p { margin-top: 16px; color: var(--muted); }

/* points */
.points { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; }
.point { position: relative; overflow: hidden; border-radius: 28px; padding: 34px 30px 38px; }
.point > * { position: relative; z-index: 1; }
.point::after { content: ""; position: absolute; right: 0; top: 0; width: 200px; height: 200px; background-image: radial-gradient(var(--dot) 1.4px, transparent 1.7px); background-size: 9px 9px; -webkit-mask-image: radial-gradient(circle at 100% 0, #000, transparent 68%); mask-image: radial-gradient(circle at 100% 0, #000, transparent 68%); }
.point:nth-child(1) { --dot: rgba(174,22,78,.42); }
.point:nth-child(2) { --dot: rgba(123,32,107,.42); }
.point:nth-child(3) { --dot: rgba(227,15,27,.38); }
.point:nth-child(1) { background: var(--rose); }
.point:nth-child(2) { background: var(--lilac); }
.point:nth-child(3) { background: var(--blush); }
.point .tag { font-size: 12px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; }
.point:nth-child(1) .tag { color: var(--raspberry); }
.point:nth-child(2) .tag { color: var(--purple); }
.point:nth-child(3) .tag { color: var(--maroon); }
.point h3 { font-size: 1.6rem; margin: 16px 0 12px; }
.point p { color: var(--muted); font-size: 16px; }

/* raisons */
.reasons { list-style: none; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 56px; max-width: 880px; }
.reasons li { display: flex; align-items: center; gap: 18px; padding-block: 18px; border-bottom: 1px solid var(--line); font-size: 1.1rem; font-weight: 500; }
.reasons li::before { content: ""; width: 12px; height: 12px; border-radius: 50%; flex: none; background: var(--purple); }
.reasons li:nth-child(3n+2)::before { background: var(--raspberry); }
.reasons li:nth-child(3n)::before { background: var(--poppy); }

/* porteur */
.owner { background: var(--white); border-radius: 32px; padding: 48px 48px; display: grid; grid-template-columns: minmax(0, .9fr) minmax(0, 1.1fr); gap: 48px; align-items: center; }
.endorse { display: flex; align-items: center; gap: 16px 24px; flex-wrap: wrap; }
.lk { display: flex; align-items: center; gap: 14px; }
.endorse .bar { width: 2px; align-self: stretch; background: var(--ink); min-height: 72px; }
.endorse .ent { font-weight: 600; font-size: 1.5rem; line-height: 1.15; color: var(--raspberry); letter-spacing: -.01em; }
.owner h2 { font-size: clamp(1.8rem, 3.4vw, 2.5rem); }
.owner p { margin-top: 14px; color: var(--muted); }
.owner p b { color: var(--ink); font-weight: 600; }

/* urgence */
.alert { background: var(--blush); border-radius: 32px; padding: 48px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 44px; align-items: center; }
.alert h2 { font-size: clamp(1.9rem, 3.6vw, 2.7rem); }
.alert p { margin-top: 14px; max-width: 42ch; }
.nums { display: grid; }
.nums div { display: flex; align-items: baseline; gap: 22px; padding-block: 14px; border-bottom: 1px solid rgba(31,18,23,.2); }
.nums div:last-child { border-bottom: 0; }
.nums b { font-weight: 700; font-size: 2.6rem; line-height: 1; min-width: 3.4ch; color: var(--maroon); font-variant-numeric: tabular-nums; letter-spacing: -.03em; }
.nums span { font-size: 15px; }

/* appel */
.final { background: var(--raspberry); color: var(--white); border-radius: 36px; padding: 64px 56px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 32px; align-items: center; }
.final h2 { font-size: clamp(2.2rem, 4.8vw, 3.6rem); max-width: 17ch; }
.final h2 span { color: var(--white); text-decoration: none; }
.final p { margin-top: 18px; max-width: 46ch; color: #FBE3EA; }
.final .actions { margin-top: 30px; }
.final .btn { background: var(--white); color: var(--raspberry); border-color: var(--white); }
.final .btn:hover { background: var(--cream); border-color: var(--cream); }
.final { position: relative; overflow: hidden; isolation: isolate; }
.final > * { position: relative; z-index: 1; }
.final::before { content: ""; position: absolute; inset: 0; z-index: 0; background-image: radial-gradient(rgba(255,255,255,.24) 1.5px, transparent 1.8px); background-size: 10px 10px; -webkit-mask-image: linear-gradient(115deg, transparent 45%, #000 100%); mask-image: linear-gradient(115deg, transparent 45%, #000 100%); }

/* superposition décorative près des raisons de venir */
#venir { position: relative; }
.ovpair { position: absolute; right: 0; top: 150px; width: 230px; height: 190px; isolation: isolate; }
.ovpair i { position: absolute; border-radius: 50%; mix-blend-mode: multiply; display: block; width: 130px; height: 130px; }
.ovpair i:nth-child(1) { left: 0; top: 0; background: #FF9AA0; }
.ovpair i:nth-child(2) { left: 70px; top: 50px; background: #CDA2DD; }
@media (max-width: 960px) { .ovpair { display: none; } }


/* parcours (rendez-vous) */
.steps { list-style: none; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; counter-reset: st; }
.steps li { counter-increment: st; background: var(--white); border-radius: 28px; padding: 30px 28px 34px; }
.steps li::before { content: counter(st); display: grid; place-items: center; width: 44px; height: 44px; border-radius: 50%; background: var(--raspberry); color: var(--white); font-weight: 700; font-size: 18px; margin-bottom: 18px; }
.steps li:nth-child(2)::before { background: var(--purple); }
.steps li:nth-child(3)::before { background: var(--poppy); }
.steps h3 { font-size: 1.3rem; margin-bottom: 8px; }
.steps p { color: var(--muted); font-size: 16px; }
.book { margin-top: 20px; background: var(--lilac); border-radius: 32px; padding: 40px 44px; display: flex; flex-wrap: wrap; gap: 20px 40px; align-items: center; justify-content: space-between; position: relative; overflow: hidden; isolation: isolate; }
.book > * { position: relative; z-index: 1; }
.book::before { content: ""; position: absolute; inset: 0; z-index: 0; background-image: radial-gradient(rgba(123,32,107,.3) 1.5px, transparent 1.8px); background-size: 9px 9px; -webkit-mask-image: linear-gradient(115deg, transparent 55%, #000 100%); mask-image: linear-gradient(115deg, transparent 55%, #000 100%); }
.book h3 { font-size: 1.6rem; }
.book p { color: var(--muted); margin-top: 8px; max-width: 46ch; }
.book .btn { background: var(--purple); border-color: var(--purple); }
.book .btn:hover { background: var(--raspberry); border-color: var(--raspberry); }
.mail { display: none; margin-top: 10px; font-size: 15px; }


/* infos pratiques */
.info { background: var(--white); border-radius: 32px; padding: 44px 44px 40px; position: relative; }
.info .ex { display: inline-block; font-size: 12px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--maroon); background: var(--blush); border-radius: 999px; padding: 4px 14px; margin-bottom: 26px; }
.ig { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0 32px; }
.ig div { border-top: 3px solid var(--purple); padding-top: 18px; }
.ig div:nth-child(2) { border-color: var(--raspberry); }
.ig div:nth-child(3) { border-color: var(--poppy); }
.ig div:nth-child(4) { border-color: var(--maroon); }
.ig .k { font-size: 12px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
.ig .v { font-weight: 600; font-size: 1.25rem; line-height: 1.25; margin-top: 8px; letter-spacing: -.01em; }
.ig .d { color: var(--muted); font-size: 15px; margin-top: 8px; line-height: 1.55; }
@media (max-width: 880px) { .info { padding: 30px 26px; } .ig { grid-template-columns: minmax(0, 1fr); gap: 26px; } }


/* icônes au trait */
.ic { display: grid; place-items: center; flex: none; width: 52px; height: 52px; border-radius: 50%; background: rgba(255,255,255,.72); color: var(--raspberry); margin-bottom: 18px; }
.ic svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.point:nth-child(2) .ic { color: var(--purple); }
.point:nth-child(3) .ic { color: var(--poppy); }
.steps li { position: relative; }
.steps .ic { position: absolute; right: 24px; top: 24px; margin: 0; background: var(--cream); width: 48px; height: 48px; }
.steps li:nth-child(2) .ic { color: var(--purple); }
.steps li:nth-child(3) .ic { color: var(--poppy); }
.rc .ic { background: var(--cream); margin-bottom: 4px; }
.rc:nth-child(3n+1) .ic { color: var(--purple); }
.rc:nth-child(3n+2) .ic { color: var(--raspberry); }
.rc:nth-child(3n) .ic { color: var(--poppy); }
.ig .ic { width: 44px; height: 44px; margin-bottom: 12px; background: var(--cream); color: var(--purple); }
.ig div:nth-child(2) .ic { color: var(--raspberry); }
.ig div:nth-child(3) .ic { color: var(--poppy); }
.ig div:nth-child(4) .ic { color: var(--maroon); }
.alert .ic { background: var(--white); color: var(--poppy); }


/* illustrations (traits fins, fond fondu dans la page) */
.il { display: block; max-width: 100%; height: auto; }
.ill-hero { width: 100%; max-width: 400px; justify-self: center; }
.ill.ill-venir { position: absolute; right: 0; top: 40px; width: 250px; }
.ill-pas { width: 260px; margin-top: -10px; }
.faqwrap { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 56px; align-items: start; }
.faqwrap .faq { max-width: none; }
.il-ruban { width: 100%; max-width: 330px; margin-inline: auto; }
.book .ill-echange { width: 150px; margin: -10px 0 -30px; flex: none; }
.book .bk { display: flex; align-items: center; gap: 28px; flex-wrap: wrap; }
@media (max-width: 960px) { .ill-venir { display: none; } .faqwrap { grid-template-columns: minmax(0, 1fr); } .ill-pas { display: none; } }



.ill { position: relative; }
.ill .il { width: 100%; }
/* ressources */
.res { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; }
.rc { background: var(--white); border-radius: 28px; padding: 28px 28px 30px; display: flex; flex-direction: column; gap: 10px; border-top: 6px solid var(--purple); }
.rc:nth-child(3n+2) { border-top-color: var(--raspberry); }
.rc:nth-child(3n) { border-top-color: var(--poppy); }
.rc .tag { font-size: 12px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: var(--purple); }
.rc h3 { font-size: 1.25rem; }
.rc p { color: var(--muted); font-size: 15.5px; flex: 1; }
.rc .num { font-weight: 700; font-size: 1.5rem; letter-spacing: -.02em; color: var(--maroon); font-variant-numeric: tabular-nums; }
.rc a.textlink { font-size: 15px; }

/* faq */
.faq { max-width: 820px; }
.faq details { border-bottom: 1px solid var(--line); padding-block: 4px; }
.faq summary { cursor: pointer; list-style: none; display: flex; justify-content: space-between; align-items: center; gap: 20px; padding-block: 18px; font-weight: 600; font-size: 1.12rem; }
.faq summary::-webkit-details-marker { display: none; }
.faq summary::after { content: "+"; flex: none; display: grid; place-items: center; width: 32px; height: 32px; border-radius: 50%; background: var(--rose); color: var(--raspberry); font-weight: 600; font-size: 20px; line-height: 1; }
.faq details[open] summary::after { content: "–"; background: var(--raspberry); color: var(--white); }
.faq details p { color: var(--muted); padding: 0 52px 20px 0; }
@media (max-width: 880px) {
  .steps, .res { grid-template-columns: minmax(0, 1fr); }
  .book { padding: 30px 26px; }
}


/* clin d'œil : Saint-Denis et Paris, au trait */
.m13 { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: #6ECFF6; color: var(--ink); font-weight: 700; font-size: 12px; line-height: 1; margin-right: 6px; vertical-align: -5px; }

.parts { border-top: 1px solid rgba(0,0,0,.08); margin-top: 40px; padding-top: 36px; text-align: center; }
.parts h2 { font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin: 0 0 20px; }
.pl { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 20px 44px; justify-content: center; align-items: center; }
.pl img { display: block; width: auto; object-fit: contain; }
.pl .cv a, .pl .ar a { background: #fff; border-radius: 14px; padding: 6px 10px; }
.pl .cv img { height: 84px; max-width: 280px; }
.pl .ar img { height: 84px; max-width: 160px; }
.pl .p8 img { height: 64px; max-width: 150px; }
.pl a { display: block; }
.pt { display: inline-block; font-weight: 700; color: var(--ink); border: 1.5px solid currentColor; border-radius: 10px; padding: 10px 18px; }

footer { display: flex; flex-wrap: wrap; gap: 20px 32px; align-items: center; justify-content: space-between; padding-block: 44px 56px; color: var(--muted); font-size: 14px; }
footer .brand { color: var(--ink); }

@media (max-width: 880px) {
  .hero { grid-template-columns: minmax(0, 1fr); gap: 32px; padding-bottom: 48px; }
  .ill-hero { max-width: 280px; justify-self: start; }
  .points { grid-template-columns: minmax(0, 1fr); }
  .reasons { grid-template-columns: minmax(0, 1fr); }
  .owner { grid-template-columns: minmax(0, 1fr); gap: 26px; padding: 32px 26px; }
  .alert { grid-template-columns: minmax(0, 1fr); padding: 32px 26px; }
  .final { grid-template-columns: minmax(0, 1fr); padding: 40px 28px; }
  .final .lw { display: none; }
  section { padding-block: 52px; }
}
@media (max-width: 520px) { .endorse .bar { display: none; } .endorse .ent br { display: none; } }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } .btn { transition: none; } }


/* formulaire de demande */
.dem{background:var(--white);border:1px solid var(--line);border-radius:32px;padding:40px 44px}
.dem .dg{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px 24px;margin:20px 0}
.dem label{display:block;font-weight:500;font-size:14px;color:var(--ink)}
.dem small{color:var(--muted);font-weight:400}
.dem input:not([type=checkbox]),.dem textarea{display:block;width:100%;margin-top:6px;font:inherit;padding:12px 14px;border:1.5px solid var(--line);border-radius:14px;background:var(--cream);color:var(--ink)}
.dem input:focus,.dem textarea:focus{outline:2px solid var(--raspberry);outline-offset:1px}
.dem fieldset{border:0;padding:0;margin:0}.dem legend{font-weight:500;font-size:14px;margin-bottom:8px}
.dem .ck{display:flex;gap:10px;align-items:flex-start;margin:6px 0;font-weight:400}.dem .ck input{margin-top:4px;accent-color:var(--raspberry)}
.dem fieldset .ck{display:inline-flex;margin-right:16px}
.dem textarea{resize:vertical}
.dem .hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
.dem .actions{display:flex;flex-wrap:wrap;gap:16px;align-items:center;margin-top:20px}
.dem button.btn{cursor:pointer}.dem button.btn:disabled{opacity:.6}
#demmsg{font-weight:500;color:var(--raspberry)}
.dem .fine{font-size:13px;color:var(--muted);margin-top:14px}
@media (max-width:640px){.dem{padding:28px 22px}}
/* mode édition */
.ed{outline:1px dashed rgba(174,22,78,.45);outline-offset:2px;border-radius:2px;cursor:text;min-width:1ch;display:inline}
.ed:hover{background:rgba(174,22,78,.07)}
.ed:focus{outline:2px solid #AE164E;background:#fff}
.edq{border-left:3px solid #AE164E;padding:.4rem .8rem;margin:.6rem 0}
body.editing{padding-bottom:9rem}
#edbar{position:fixed;left:0;right:0;bottom:0;z-index:99;background:#75151F;color:#FDF5EB;padding:.7rem 1rem;display:flex;flex-direction:column;gap:.5rem;font:500 14px/1.4 Poppins,sans-serif;box-shadow:0 -4px 16px rgba(0,0,0,.2)}
#edbar .edrow{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center}
#edbar input{font:inherit;padding:.35rem .6rem;border-radius:6px;border:0;min-width:14rem}
#edbar code{background:rgba(255,255,255,.15);padding:0 .3rem;border-radius:3px}
.edbtn{font:inherit;font-weight:600;border:0;border-radius:999px;padding:.45rem 1.1rem;background:#AE164E;color:#fff;cursor:pointer}
.edbtn.edlight{background:transparent;border:1px solid #FDF5EB}
.edmsg{font-weight:600}
</style>
