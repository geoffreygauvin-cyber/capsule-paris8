[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/gestion"
  to = "/gestion.html"
  status = 200

[[headers]]
  for = "/gestion*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
    Referrer-Policy = "no-referrer"

[[headers]]
  for = "/charte/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
