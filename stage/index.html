<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Passe ton stage</title>
<style>
  :root{--ink:#2B1A22;--muted:#6B5861;--rasp:#AE164E;--bg:#FDF5EB;--rose:#F9DEE5}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5}
  main{max-width:520px;background:#fff;border-radius:22px;padding:32px 28px;box-shadow:0 1px 0 rgba(43,26,34,.06),0 12px 32px rgba(43,26,34,.07)}
  .tag{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--rasp);background:var(--rose);border-radius:99px;padding:4px 12px}
  h1{margin:14px 0 8px;font-size:30px;letter-spacing:-.01em}
  p{margin:0;color:var(--muted)}
</style>
</head>
<body>
<main>
  <span class="tag">En construction</span>
  <h1>Passe ton stage</h1>
  <p>La plateforme de gestion des stages arrive bientôt.</p>
</main>
</body>
</html>
